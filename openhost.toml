[app]
name = "mealie"
version = "0.1.0"
description = "Mealie self-hosted recipe manager with a cooking timeline for iterating on recipes over multiple attempts."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/_healthz"
# Mealie is a private recipe collection for the zone owner; there is no
# anonymous public-sharing surface, so nothing is exposed without zone auth.
public_paths = []

[resources]
memory_mb = 1024
cpu_millicores = 750

[data]
app_data = true
app_temp_data = true
